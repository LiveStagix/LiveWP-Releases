name: Publish VirusTotal scan status

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - Stable
    paths:
      - ".github/scripts/virustotal_scan.py"
      - ".github/workflows/virustotal-scan.yml"

permissions:
  contents: write

concurrency:
  group: livestagix-release-virustotal
  cancel-in-progress: false

jobs:
  scan:
    name: Verify and scan all published APK packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the Stable release branch
        uses: actions/checkout@v4
        with:
          ref: Stable

      - name: Validate scanner script syntax
        run: python3 -m py_compile .github/scripts/virustotal_scan.py

      - name: Set up Android SDK Build Tools for APK signature verification
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'

      - name: Verify and scan each available APK package
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          packages=(universal arm64-v8a armeabi-v7a x86 x86_64)
          failures=0

          for package in "${packages[@]}"; do
            echo "::group::Verify ${package}"
            if APK_PACKAGE_KEY="${package}" python3 .github/scripts/virustotal_scan.py; then
              echo "Completed ${package} package processing."
            else
              echo "::warning::Package processing failed for ${package}. Other packages will still be processed."
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "Package processing finished with ${failures} error(s)."
          echo "failures=${failures}" >> "$GITHUB_OUTPUT"

      - name: Publish release verification and scan metadata on Stable
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/scan-status.json
          if git diff --cached --quiet; then
            echo "No scan-status update to commit."
            exit 0
          fi
          git commit -m "Publish VirusTotal scan status"
          git push origin HEAD:Stable

      - name: Report incomplete package scans
        if: always() && steps.scan.outputs.failures != '0'
        run: |
          echo "One or more package scans failed. Check the per-package status records and workflow logs."
          exit 1
